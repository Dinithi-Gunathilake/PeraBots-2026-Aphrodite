#VRML_SIM R2025a utf8
# TwoWheelRobot.proto - minimal differential-drive robot base for teams to
# customize. Chassis, wheels, motors, caster and physics are fixed/locked;
# teams may only change cosmetic fields and add their own sensors/parts
# through "extensionSlot" without touching the drivetrain itself.
# supervisor is hardcoded FALSE and not exposed, so it cannot be enabled.

PROTO TwoWheelRobot [
  field SFVec3f    translation    0 0 0
  field SFRotation rotation       0 0 1 0
  field SFString   name           "TwoWheelRobot"
  field SFString   controller     "<none>"
  field MFString   controllerArgs []
  field SFColor    bodyColor      0.15 0.15 0.6
  field MFNode     extensionSlot  [
    Camera {
      name "camera"
      translation 0 0 0.08
      rotation 0 1 0 -1.5708
      width 64
      height 64
      children [
        Shape {
          appearance PBRAppearance { baseColor 0.8 0.2 0.2 roughness 1 metalness 0 }
          geometry Box { size 0.02 0.02 0.02 }
        }
      ]
    }
    DistanceSensor {
      name "ds_front_0"
      translation 0.0420 -0.0200 0.02
      rotation 0 0 1 0.0000
      lookupTable [ 0 0 0, 0.6 0.6 0 ]
      type "infra-red"
      children [
        Shape {
          appearance PBRAppearance { baseColor 0.2 0.8 0.2 roughness 1 metalness 0 }
          geometry Box { size 0.008 0.008 0.008 }
        }
      ]
    }
    DistanceSensor {
      name "ds_front_1"
      translation 0.0420 -0.0100 0.02
      rotation 0 0 1 0.0000
      lookupTable [ 0 0 0, 0.6 0.6 0 ]
      type "infra-red"
      children [
        Shape {
          appearance PBRAppearance { baseColor 0.2 0.8 0.2 roughness 1 metalness 0 }
          geometry Box { size 0.008 0.008 0.008 }
        }
      ]
    }
    DistanceSensor {
      name "ds_front_2"
      translation 0.0420 0.0000 0.02
      rotation 0 0 1 0.0000
      lookupTable [ 0 0 0, 0.6 0.6 0 ]
      type "infra-red"
      children [
        Shape {
          appearance PBRAppearance { baseColor 0.2 0.8 0.2 roughness 1 metalness 0 }
          geometry Box { size 0.008 0.008 0.008 }
        }
      ]
    }
    DistanceSensor {
      name "ds_front_3"
      translation 0.0420 0.0100 0.02
      rotation 0 0 1 0.0000
      lookupTable [ 0 0 0, 0.6 0.6 0 ]
      type "infra-red"
      children [
        Shape {
          appearance PBRAppearance { baseColor 0.2 0.8 0.2 roughness 1 metalness 0 }
          geometry Box { size 0.008 0.008 0.008 }
        }
      ]
    }
    DistanceSensor {
      name "ds_front_4"
      translation 0.0420 0.0200 0.02
      rotation 0 0 1 0.0000
      lookupTable [ 0 0 0, 0.6 0.6 0 ]
      type "infra-red"
      children [
        Shape {
          appearance PBRAppearance { baseColor 0.2 0.8 0.2 roughness 1 metalness 0 }
          geometry Box { size 0.008 0.008 0.008 }
        }
      ]
    }
    DistanceSensor {
      name "ds_back_0"
      translation -0.0420 -0.0200 0.02
      rotation 0 0 1 3.1416
      lookupTable [ 0 0 0, 0.6 0.6 0 ]
      type "infra-red"
      children [
        Shape {
          appearance PBRAppearance { baseColor 0.2 0.8 0.2 roughness 1 metalness 0 }
          geometry Box { size 0.008 0.008 0.008 }
        }
      ]
    }
    DistanceSensor {
      name "ds_back_1"
      translation -0.0420 -0.0100 0.02
      rotation 0 0 1 3.1416
      lookupTable [ 0 0 0, 0.6 0.6 0 ]
      type "infra-red"
      children [
        Shape {
          appearance PBRAppearance { baseColor 0.2 0.8 0.2 roughness 1 metalness 0 }
          geometry Box { size 0.008 0.008 0.008 }
        }
      ]
    }
    DistanceSensor {
      name "ds_back_2"
      translation -0.0420 0.0000 0.02
      rotation 0 0 1 3.1416
      lookupTable [ 0 0 0, 0.6 0.6 0 ]
      type "infra-red"
      children [
        Shape {
          appearance PBRAppearance { baseColor 0.2 0.8 0.2 roughness 1 metalness 0 }
          geometry Box { size 0.008 0.008 0.008 }
        }
      ]
    }
    DistanceSensor {
      name "ds_back_3"
      translation -0.0420 0.0100 0.02
      rotation 0 0 1 3.1416
      lookupTable [ 0 0 0, 0.6 0.6 0 ]
      type "infra-red"
      children [
        Shape {
          appearance PBRAppearance { baseColor 0.2 0.8 0.2 roughness 1 metalness 0 }
          geometry Box { size 0.008 0.008 0.008 }
        }
      ]
    }
    DistanceSensor {
      name "ds_back_4"
      translation -0.0420 0.0200 0.02
      rotation 0 0 1 3.1416
      lookupTable [ 0 0 0, 0.6 0.6 0 ]
      type "infra-red"
      children [
        Shape {
          appearance PBRAppearance { baseColor 0.2 0.8 0.2 roughness 1 metalness 0 }
          geometry Box { size 0.008 0.008 0.008 }
        }
      ]
    }
    DistanceSensor {
      name "ds_left_0"
      translation -0.0300 0.0270 0.02
      rotation 0 0 1 1.5708
      lookupTable [ 0 0 0, 0.6 0.6 0 ]
      type "infra-red"
      children [
        Shape {
          appearance PBRAppearance { baseColor 0.2 0.8 0.2 roughness 1 metalness 0 }
          geometry Box { size 0.008 0.008 0.008 }
        }
      ]
    }
    DistanceSensor {
      name "ds_left_1"
      translation -0.0150 0.0270 0.02
      rotation 0 0 1 1.5708
      lookupTable [ 0 0 0, 0.6 0.6 0 ]
      type "infra-red"
      children [
        Shape {
          appearance PBRAppearance { baseColor 0.2 0.8 0.2 roughness 1 metalness 0 }
          geometry Box { size 0.008 0.008 0.008 }
        }
      ]
    }
    DistanceSensor {
      name "ds_left_2"
      translation 0.0000 0.0270 0.02
      rotation 0 0 1 1.5708
      lookupTable [ 0 0 0, 0.6 0.6 0 ]
      type "infra-red"
      children [
        Shape {
          appearance PBRAppearance { baseColor 0.2 0.8 0.2 roughness 1 metalness 0 }
          geometry Box { size 0.008 0.008 0.008 }
        }
      ]
    }
    DistanceSensor {
      name "ds_left_3"
      translation 0.0150 0.0270 0.02
      rotation 0 0 1 1.5708
      lookupTable [ 0 0 0, 0.6 0.6 0 ]
      type "infra-red"
      children [
